openapi: 3.1.0
info:
  title: OpenMusicMetadata API
  version: 1.0.0
  description: Canonical metadata for OpenMusic songs, albums, and artists.
  license:
    name: AGPL-3.0

servers:
  - url: https://api.vleer.app/metadata/v1
    description: Production server

tags:
  - name: Metadata
  - name: Lookup
  - name: Search

paths:
  /:
    get:
      tags: [Metadata]
      summary: Get metadata stats
      operationId: getMetadata
      responses:
        "200":
          description: Metadata stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metadata"
        default:
          $ref: "#/components/responses/Error"

  /lookup:
    get:
      tags: [Lookup]
      summary: Look up metadata resources
      operationId: lookupResources
      description: Returns matching resources in request order. Missing ids are excluded and listed in meta.missingIds.
      parameters:
        - $ref: "#/components/parameters/LookupIds"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/FieldsSong"
        - $ref: "#/components/parameters/FieldsAlbum"
        - $ref: "#/components/parameters/FieldsArtist"
      responses:
        "200":
          description: Resource collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollection"
        default:
          $ref: "#/components/responses/Error"

  /lookup/{id}:
    get:
      tags: [Lookup]
      summary: Look up one metadata resource
      operationId: lookupResource
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/FieldsSong"
        - $ref: "#/components/parameters/FieldsAlbum"
        - $ref: "#/components/parameters/FieldsArtist"
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceSingle"
        default:
          $ref: "#/components/responses/Error"

  /search/{type}:
    get:
      tags: [Search]
      summary: Search one metadata resource type
      operationId: searchType
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [song, album, artist]
        - name: name
          in: query
          required: false
          description: Search by resource name.
          schema:
            type: string
        - name: album
          in: query
          required: false
          description: Search or filter by album name.
          schema:
            type: string
        - name: artist
          in: query
          required: false
          description: Search or filter by artist name.
          schema:
            type: string
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/FieldsSong"
        - $ref: "#/components/parameters/FieldsAlbum"
        - $ref: "#/components/parameters/FieldsArtist"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchTypeResponse"
        default:
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: OpenMusicMetadata id.
      schema:
        $ref: "#/components/schemas/Id"

    LookupIds:
      name: ids
      in: query
      required: true
      description: Comma-separated OpenMusicMetadata ids. Maximum 100 ids.
      schema:
        type: string
      example: omm:song:1,omm:album:2,omm:artist:3

    Include:
      name: include
      in: query
      required: false
      description: Comma-separated relationships to include. Songs support albums and artists. Albums support artists. Artists do not support includes.
      schema:
        type: string
      examples:
        song:
          value: albums,artists
        album:
          value: artists

    FieldsSong:
      name: fields[song]
      in: query
      required: false
      description: Comma-separated song fields.
      schema:
        type: string
      example: name,artworkUrl,isrc

    FieldsAlbum:
      name: fields[album]
      in: query
      required: false
      description: Comma-separated album fields.
      schema:
        type: string
      example: name,artworkUrl,upc

    FieldsArtist:
      name: fields[artist]
      in: query
      required: false
      description: Comma-separated artist fields.
      schema:
        type: string
      example: name,artworkUrl

  schemas:
    Metadata:
      type: object
      required: [stats]
      properties:
        stats:
          type: object
          required: [songs, albums, artists]
          properties:
            songs:
              type: integer
              minimum: 0
            albums:
              type: integer
              minimum: 0
            artists:
              type: integer
              minimum: 0

    ResourceType:
      type: string
      enum: [song, album, artist]

    Id:
      type: string
      description: OpenMusicMetadata id.
      examples:
        - omm:song:1
        - omm:album:2
        - omm:artist:3

    Resource:
      type: object
      required: [id, type]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/ResourceType"

    ArtworkUrl:
      type: string
      description: Artwork URL. It may contain {w} and {h} placeholders for client-selected width and height.

    ListMeta:
      type: object
      required: [total]
      properties:
        total:
          type: integer
          minimum: 0

    CollectionMeta:
      type: object
      required: [missingIds]
      properties:
        missingIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    Song:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [type, attributes]
          properties:
            type:
              const: song
            attributes:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                albumName:
                  type: string
                artistName:
                  type: string
                isrc:
                  type: string
                artworkUrl:
                  $ref: "#/components/schemas/ArtworkUrl"
                trackNumber:
                  type: integer
                  minimum: 1
                discNumber:
                  type: integer
                  minimum: 1
                genres:
                  type: array
                  items:
                    type: string
                releaseDate:
                  type: string
                  description: Date string in YYYY, YYYY-MM, or YYYY-MM-DD form.
                durationMs:
                  type: integer
                  minimum: 0
            relationships:
              type: object
              properties:
                albums:
                  $ref: "#/components/schemas/AlbumList"
                artists:
                  $ref: "#/components/schemas/ArtistList"

    Album:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [type, attributes]
          properties:
            type:
              const: album
            attributes:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                trackCount:
                  type: integer
                  minimum: 0
                artistName:
                  type: string
                artworkUrl:
                  $ref: "#/components/schemas/ArtworkUrl"
                upc:
                  type: string
                genres:
                  type: array
                  items:
                    type: string
                releaseDate:
                  type: string
                  description: Date string in YYYY, YYYY-MM, or YYYY-MM-DD form.
            relationships:
              type: object
              properties:
                artists:
                  $ref: "#/components/schemas/ArtistList"

    Artist:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [type, attributes]
          properties:
            type:
              const: artist
            attributes:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                artworkUrl:
                  $ref: "#/components/schemas/ArtworkUrl"

    ResourceSingle:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/Song"
            - $ref: "#/components/schemas/Album"
            - $ref: "#/components/schemas/Artist"

    SongList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Song"
        meta:
          $ref: "#/components/schemas/ListMeta"

    AlbumList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Album"
        meta:
          $ref: "#/components/schemas/ListMeta"

    ArtistList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        meta:
          $ref: "#/components/schemas/ListMeta"

    ResourceCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Song"
              - $ref: "#/components/schemas/Album"
              - $ref: "#/components/schemas/Artist"
        meta:
          $ref: "#/components/schemas/CollectionMeta"

    SearchTypeResponse:
      oneOf:
        - $ref: "#/components/schemas/SongList"
        - $ref: "#/components/schemas/AlbumList"
        - $ref: "#/components/schemas/ArtistList"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, message]
          properties:
            status:
              type: integer
              minimum: 100
              maximum: 599
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/ErrorDetail"
            requestId:
              type: string

    ErrorDetail:
      type: object
      required: [message]
      properties:
        message:
          type: string
        param:
          type: string
        value: {}
