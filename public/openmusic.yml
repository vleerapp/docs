          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExploreSection"
        default:
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource id. This can be a local id or an OpenMusicMetadata id like omm:song:123456789.
      schema:
        $ref: "#/components/schemas/Id"

    FileId:
      name: id
      in: path
      required: true
      description: File id.
      schema:
        type: string

    Lang:
      name: lang
      in: query
      required: false
      description: Preferred language as a BCP 47 language tag.
      schema:
        type: string
      examples:
        english:
          value: en-US
        germanSwiss:
          value: de-CH

    Include:
      name: include
      in: query
      required: false
      description: Comma-separated relationships to include. Nested includes use dot notation and may be up to three levels deep from the root resource.
      schema:
        type: string
      examples:
        album:
          value: albums
        albumTracks:
          value: albums,albums.tracks
        deep:
          value: albums,albums.tracks,albums.tracks.artists

    LimitIncluded:
      name: limit[{relationship}]
      in: query
      required: false
      allowReserved: true
      description: Limit an included relationship. Replace {relationship} with the included path in resource:relationship form, for example limit[albums:tracks].
      schema:
        type: integer
        minimum: 1
        maximum: 100
      examples:
        albumTracks:
          value: 10

    SortIncluded:
      name: sort[{relationship}]
      in: query
      required: false
      allowReserved: true
      description: Sort an included relationship. Replace {relationship} with the included path in resource:relationship form, for example sort[albums:tracks]. Supports name, dateAdded, and minus-prefixed descending variants. Song and album relationships also support releaseDate and -releaseDate.
      schema:
        type: string
        enum: [name, -name, dateAdded, -dateAdded, releaseDate, -releaseDate]
      examples:
        albumTracks:
          value: name

    FieldsSong:
      name: fields[song]
      in: query
      required: false
      description: Comma-separated song fields.
      schema:
        type: string
      example: name,artworkUrl

    FieldsAlbum:
      name: fields[album]
      in: query
      required: false
      description: Comma-separated album fields.
      schema:
        type: string
      example: name,artworkUrl

    FieldsArtist:
      name: fields[artist]
      in: query
      required: false
      description: Comma-separated artist fields.
      schema:
        type: string
      example: name,artworkUrl

    FieldsPlaylist:
      name: fields[playlist]
      in: query
      required: false
      description: Comma-separated playlist fields.
      schema:
        type: string
      example: name,description

    FieldsStation:
      name: fields[station]
      in: query
      required: false
      description: Comma-separated station fields.
      schema:
        type: string
      example: name,description

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of resources to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    Offset:
      name: offset
      in: query
      required: false
      description: Number of resources to skip.
      schema:
        type: integer
        minimum: 0
        default: 0

    Sort:
      name: sort
      in: query
      required: false
      description: Sort field. Supports name, dateAdded, and minus-prefixed descending variants. dateAdded is the date the resource was added to the server. Song and album result sets also support releaseDate and -releaseDate.
      schema:
        type: string
        enum: [name, -name, dateAdded, -dateAdded, releaseDate, -releaseDate]
      example: name

    LookupId:
      name: id
      in: query
      required: false
      description: Comma-separated ids. The order of returned resources should match the request order. Maximum 100 ids.
      schema:
        type: string
      example: 1,omm:song:2

    LookupIsrc:
      name: isrc
      in: query
      required: false
      description: Comma-separated ISRC values.
      schema:
        type: string
      example: USRC17607839,GBARL0600786

    LookupUpc:
      name: upc
      in: query
      required: false
      description: Comma-separated UPC values.
      schema:
        type: string

    SearchTerm:
      name: term
      in: query
      required: true
      description: Search term.
      schema:
        type: string

  schemas:
    Id:
      type: string
      description: Local resource id or OpenMusicMetadata id.
      examples:
        - "123456789"
        - "omm:song:123456789"

    ResourceType:
      type: string
      enum: [song, artist, album, playlist, station]

    Resource:
      type: object
      required: [id, type]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/ResourceType"

    ArtworkUrl:
      type: string
      description: Artwork URL. It may contain {w} and {h} placeholders for client-selected width and height.

    ListMeta:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    CollectionMeta:
      type: object
      required: [missingIds]
      properties:
        missingIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    MusicFile:
      type: object
      required: [id, lossless, mimeType, sizeBytes, durationMs]
      properties:
        id:
          type: string
        lossless:
          type: boolean
        mimeType:
          type: string
          example: audio/flac
        sizeBytes:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
        streamUrl:
          type: string
          format: uri
          description: If omitted, clients can use /file/{id}/stream.
        downloadUrl:
          type: string
          format: uri
          description: If omitted, clients can use /file/{id}/download.
        codec:
          type: string
          example: flac
        bitrateKbps:
          type: integer
          minimum: 0
        sampleRateHz:
          type: integer
          minimum: 0
        channels:
          type: integer
          minimum: 1

    Lyrics:
      type: object
      required: [lang, text]
      properties:
        lang:
          type: string
          description: BCP 47 language tag.
          example: en-US
        text:
          type: string
        ttml:
          type: string
          description: Timed Text Markup Language payload.

    Song:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [type, attributes]
          properties:
            type:
              const: song
            attributes:
              type: object
              required: [name, files]
              properties:
                name:
                  type: string
                files:
                  type: object
                  required: [preferred]
                  properties:
                    preferred:
                      $ref: "#/components/schemas/MusicFile"
                    alternatives:
                      type: array
                      items:
                        $ref: "#/components/schemas/MusicFile"
                albumName:
                  type: string
                artistName:
                  type: string
                isrc:
                  type: string
                artworkUrl:
                  $ref: "#/components/schemas/ArtworkUrl"
                trackNumber:
                  type: integer
                  minimum: 1
                discNumber:
                  type: integer
                  minimum: 1
                genres:
                  type: array
                  items:
                    type: string
                releaseDate:
                  type: string
                  description: Date string in YYYY, YYYY-MM, or YYYY-MM-DD form.
                durationMs:
                  type: integer
                  minimum: 0
                lyrics:
                  $ref: "#/components/schemas/Lyrics"
            relationships:
              type: object
              properties:
                albums:
                  $ref: "#/components/schemas/AlbumList"
                artists:
                  $ref: "#/components/schemas/ArtistList"

    Album:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [type, attributes]
          properties:
            type:
              const: album
            attributes:
              type: object
              required: [name, trackCount]
              properties:
                name:
                  type: string
                trackCount:
                  type: integer
                  minimum: 0
                artistName:
                  type: string
                artworkUrl:
                  $ref: "#/components/schemas/ArtworkUrl"
                upc:
                  type: string
                genres:
                  type: array
                  items:
                    type: string
                releaseDate:
                  type: string
                  description: Date string in YYYY, YYYY-MM, or YYYY-MM-DD form.
            relationships:
              type: object
              properties:
                tracks:
                  $ref: "#/components/schemas/SongList"
                artists:
                  $ref: "#/components/schemas/ArtistList"

    Artist:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [type, attributes]
          properties:
            type:
              const: artist
            attributes:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                artworkUrl:
                  $ref: "#/components/schemas/ArtworkUrl"
            relationships:
              type: object
              properties:
                tracks:
                  $ref: "#/components/schemas/SongList"
                albums:
                  $ref: "#/components/schemas/AlbumList"

    Playlist:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [type, attributes]
          properties:
            type:
              const: playlist
            attributes:
              type: object
              required: [name, trackCount]
              properties:
                name:
                  type: string
                trackCount:
                  type: integer
                  minimum: 0
                curatorName:
                  type: string
                artworkUrl:
                  $ref: "#/components/schemas/ArtworkUrl"
                description:
                  type: string
            relationships:
              type: object
              properties:
                tracks:
                  $ref: "#/components/schemas/SongList"

    StationSeed:
      oneOf:
        - type: object
          required: [kind, type, id]
          properties:
            kind:
              const: resource
            type:
              type: string
              enum: [song, album, artist]
            id:
              $ref: "#/components/schemas/Id"
        - type: object
          required: [kind, name]
          properties:
            kind:
              const: genre
            name:
              type: string
        - type: object
          required: [kind]
          properties:
            kind:
              const: popular
        - type: object
          required: [kind]
          properties:
            kind:
              const: custom

    Station:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [type, attributes]
          properties:
            type:
              const: station
            attributes:
              type: object
              required: [name, seed]
              properties:
                name:
                  type: string
                seed:
                  $ref: "#/components/schemas/StationSeed"
                artworkUrl:
                  $ref: "#/components/schemas/ArtworkUrl"
                description:
                  type: string
            relationships:
              type: object
              properties:
                tracks:
                  $ref: "#/components/schemas/SongList"

    SongSingle:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Song"

    AlbumSingle:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Album"

    ArtistSingle:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Artist"

    PlaylistSingle:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Playlist"

    StationSingle:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Station"

    SongList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Song"
        meta:
          $ref: "#/components/schemas/ListMeta"

    AlbumList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Album"
        meta:
          $ref: "#/components/schemas/ListMeta"

    ArtistList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        meta:
          $ref: "#/components/schemas/ListMeta"

    PlaylistList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Playlist"
        meta:
          $ref: "#/components/schemas/ListMeta"

    StationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Station"
        meta:
          $ref: "#/components/schemas/ListMeta"

    SongCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Song"
        meta:
          $ref: "#/components/schemas/CollectionMeta"

    AlbumCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Album"
        meta:
          $ref: "#/components/schemas/CollectionMeta"

    ArtistCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        meta:
          $ref: "#/components/schemas/CollectionMeta"

    PlaylistCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Playlist"
        meta:
          $ref: "#/components/schemas/CollectionMeta"

    Search:
      type: object
      properties:
        songs:
          $ref: "#/components/schemas/SongList"
        albums:
          $ref: "#/components/schemas/AlbumList"
        artists:
          $ref: "#/components/schemas/ArtistList"
        playlists:
          $ref: "#/components/schemas/PlaylistList"
        top:
          type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                oneOf:
                  - $ref: "#/components/schemas/Song"
                  - $ref: "#/components/schemas/Album"
                  - $ref: "#/components/schemas/Artist"
                  - $ref: "#/components/schemas/Playlist"
            meta:
              $ref: "#/components/schemas/ListMeta"

    SearchTypeResponse:
      oneOf:
        - $ref: "#/components/schemas/SongList"
        - $ref: "#/components/schemas/AlbumList"
        - $ref: "#/components/schemas/ArtistList"
        - $ref: "#/components/schemas/PlaylistList"

    ExploreSection:
      type: object
      required: [title, type, data]
      properties:
        title:
          type: string
        type:
          $ref: "#/components/schemas/ResourceType"
        data:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Song"
              - $ref: "#/components/schemas/Album"
              - $ref: "#/components/schemas/Artist"
              - $ref: "#/components/schemas/Playlist"
              - $ref: "#/components/schemas/Station"

    Info:
      type: object
      required: [branding, openmusic]
      properties:
        branding:
          type: object
          required: [name]
          properties:
            name:
              type: string
            description:
              type: string
            logoUrl:
              type: string
              format: uri
            shortName:
              type: string
            themeHex:
              type: string
              pattern: "^#[0-9A-Fa-f]{6}$"
            website:
              type: string
              format: uri
            email:
              type: string
              format: email
            location:
              type: string
              description: ISO 3166-1 alpha-2 country code.
              minLength: 2
              maxLength: 2
            operator:
              type: string
        openmusic:
          type: object
          required: [version, capabilities]
          properties:
            version:
              type: string
              enum: ["1.0"]
            capabilities:
              type: array
              items:
                type: string
                enum: [streaming, stations, explore]
        authentication:
          type: object
          properties:
            methods:
              type: array
              items:
                $ref: "#/components/schemas/AuthenticationMethod"

    AuthenticationMethod:
      oneOf:
        - type: object
          required: [type]
          properties:
            type:
              const: none
        - type: object
          required: [type]
          properties:
            type:
              const: bearer
            createTokenUrl:
              type: string
              format: uri
        - type: object
          required: [type, in, name]
          properties:
            type:
              const: api_key
            in:
              type: string
              enum: [header, query]
            name:
              type: string
            createApiKeyUrl:
              type: string
              format: uri
        - type: object
          required: [type, authorizationUrl, tokenUrl]
          properties:
            type:
              const: oauth2
            authorizationUrl:
              type: string
              format: uri
            tokenUrl:
              type: string
              format: uri

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, message]
          properties:
            status:
              type: integer
              minimum: 100
              maximum: 599
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/ErrorDetail"
            requestId:
              type: string

    ErrorDetail:
      type: object
      required: [message]
      properties:
        message:
          type: string
        param:
          type: string
        value: {}
