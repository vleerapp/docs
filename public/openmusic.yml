      tags: [Search]
      summary: Get search suggestions
      operationId: getSearchSuggestions
      parameters:
        - $ref: "#/components/parameters/SearchTerm"
      responses:
        "200":
          description: Search suggestions
          content:
            application/json:
              schema:
                type: array
