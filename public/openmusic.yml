openapi: 3.1.0
info:
  title: OpenMusic API
  version: 1.0.0
  description: Open standard for music service communication.
  license:
    name: AGPL-3.0

servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://api.example.com/api
    description: Production server

tags:
  - name: Info
  - name: Files
  - name: Songs
  - name: Albums
  - name: Artists
  - name: Playlists
  - name: Stations
  - name: Search
  - name: Explore

paths:
  /:
    get:
      tags: [Info]
      summary: Get API info
      operationId: getInfo
      responses:
        "200":
          description: API info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        default:
          $ref: "#/components/responses/Error"

  /file/{id}/stream:
    get:
      tags: [Files]
      summary: Stream a music file
      operationId: streamFile
      description: Streams the file. Implementations that support streaming should support Range requests and return 206 Partial Content for partial responses.
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: Range
          in: header
          required: false
          description: Byte range for partial content.
          schema:
            type: string
            example: bytes=0-1023
      responses:
        "200":
          description: Full file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "501":
          description: Streaming is not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"

  /file/{id}/download:
    get:
      tags: [Files]
      summary: Download a music file
      operationId: downloadFile
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

  /songs:
    get:
      tags: [Songs]
      summary: List songs
      operationId: listSongs
      parameters:
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/LimitIncluded"
        - $ref: "#/components/parameters/SortIncluded"
        - $ref: "#/components/parameters/FieldsSong"
        - $ref: "#/components/parameters/FieldsAlbum"
        - $ref: "#/components/parameters/FieldsArtist"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Song list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongList"
        default:
          $ref: "#/components/responses/Error"

  /songs/lookup:
    get:
      tags: [Songs]
      summary: Look up songs
      operationId: lookupSongs
      description: Returns matching songs in request order. Missing ids are excluded and listed in meta.missingIds. A lookup request should contain at most 100 ids.
      parameters:
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/LookupId"
        - $ref: "#/components/parameters/LookupIsrc"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/LimitIncluded"
        - $ref: "#/components/parameters/SortIncluded"
        - $ref: "#/components/parameters/FieldsSong"
        - $ref: "#/components/parameters/FieldsAlbum"
        - $ref: "#/components/parameters/FieldsArtist"
      responses:
        "200":
          description: Song collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongCollection"
        default:
          $ref: "#/components/responses/Error"

  /song/{id}:
    get:
      tags: [Songs]
      summary: Get a song
      operationId: getSong
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/LimitIncluded"
        - $ref: "#/components/parameters/SortIncluded"
        - $ref: "#/components/parameters/FieldsSong"
        - $ref: "#/components/parameters/FieldsAlbum"
        - $ref: "#/components/parameters/FieldsArtist"
      responses:
        "200":
          description: Song
          content:
            application/json:
              schema:
