        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/LimitIncluded"
        - $ref: "#/components/parameters/SortIncluded"
        - $ref: "#/components/parameters/FieldsAlbum"
        - $ref: "#/components/parameters/FieldsSong"
